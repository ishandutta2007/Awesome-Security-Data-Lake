<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="320" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0a0d12"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#3fb950"/><stop offset="100%" stop-color="#bc8cff"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#21262d" stop-opacity=".7"/><stop offset="100%" stop-color="#161b22" stop-opacity=".4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGrid{0%{opacity:.15}50%{opacity:.35}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.3}50%{transform:translateY(-15px);opacity:.8}}.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:19px;fill:#8b949e}.badge-text{font-weight:600;font-size:14px;fill:#58a6ff}.badge-text,.stat-title,.stat-value{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.stat-title{font-size:12px;fill:#8b949e;text-transform:uppercase;letter-spacing:1px}.stat-value{font-weight:700;font-size:17px;fill:#3fb950}.bg-grid{animation:pulseGrid 4s ease-in-out infinite}.particle-1{animation:floatParticle 3s ease-in-out infinite}.particle-2{animation:floatParticle 4s ease-in-out infinite 1s}.particle-3{animation:floatParticle 5s ease-in-out infinite .5s}</style><rect width="1200" height="320" fill="url(#bg-grad)" rx="12"/><g stroke="#30363d" stroke-width="1" class="bg-grid"><line x1="0" x2="1200"