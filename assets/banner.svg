<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #58a6ff; }
    .stat-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #3fb950; }
    
    @keyframes pulseGrid {
      0% { opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { opacity: 0.15; }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-15px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }

    .bg-grid { animation: pulseGrid 4s ease-in-out infinite; }
    .particle-1 { animation: floatParticle 3s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 4s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="12" />

  <!-- Animated Tech Grid Background -->
  <g class="bg-grid" stroke="#30363d" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />

    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="850" y1="0" x2="850" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1150" y1="0" x2="1150" y2="320" />
  </g>

  <!-- Ambient Glow Behind Text (Ensures Text Primacy) -->
  <circle cx="300" cy="140" r="180" fill="#1f6feb" opacity="0.15" filter="url(#glow)" />
  <circle cx="950" cy="160" r="150" fill="#238636" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Glowing Nodes in Background -->
  <g class="particle-1">
    <circle cx="880" cy="70" r="4" fill="#58a6ff" />
    <circle cx="1050" cy="220" r="5" fill="#3fb950" />
  </g>
  <g class="particle-2">
    <circle cx="750" cy="250" r="6" fill="#bc8cff" />
    <circle cx="980" cy="100" r="4" fill="#58a6ff" />
  </g>
  <g class="particle-3">
    <circle cx="1120" cy="130" r="5" fill="#d29922" />
  </g>

  <!-- Decorative Architectural Lines (Right Side Background) -->
  <path d="M 750 240 L 820 180 L 920 180 L 980 120 L 1100 120" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 800 280 L 870 210 L 1000 210 L 1060 150 L 1150 150" fill="none" stroke="#21262d" stroke-width="2" />

  <!-- Foreground Badge -->
  <rect x="60" y="45" width="260" height="32" rx="16" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb" stroke-width="1" />
  <text x="78" y="66" class="badge-text">🛡️ SECURITY DATA LAKE HUB</text>

  <!-- Main Title & Subtitle (Always Clear & Unobscured in Foreground) -->
  <text x="60" y="125" class="title">Awesome Security Data Lake</text>
  <text x="60" y="165" class="subtitle">Curated SaaS Platforms, Open-Source Lakes, &amp; Detection Engineering Stacks</text>

  <!-- Accent Line Divider -->
  <rect x="60" y="190" width="670" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Summary Stats Cards (Bottom Left / Center) -->
  <g transform="translate(60, 215)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="58" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />
    <text x="16" y="22" class="stat-title">Market Size</text>
    <text x="16" y="44" class="stat-value">$10.8B+ (2026)</text>

    <!-- Card 2 -->
    <rect x="195" y="0" width="180" height="58" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />
    <text x="211" y="22" class="stat-title">Table Formats</text>
    <text x="211" y="44" class="stat-value" fill="#58a6ff">Iceberg / Delta</text>

    <!-- Card 3 -->
    <rect x="390" y="0" width="200" height="58" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" />
    <text x="406" y="22" class="stat-title">Detection Engine</text>
    <text x="406" y="44" class="stat-value" fill="#bc8cff">Sigma / Python</text>
  </g>
</svg>
